services:
  - type: web
    name: realistic-login-lab
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: LAB_USERNAME
        value: labuser
      - key: LAB_PASSWORD
        sync: false
      - key: LAB_DELAY
        value: "0.030"
      - key: FLASK_SECRET_KEY
        generateValue: true
